name: Build iOS IPA Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Client
        run: |
          cd client
          npm install
          npm run build
          npx cap sync ios

      - name: Build iOS Xcode Archive
        run: |
          cd client/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -destination generic/platform=iOS \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create GlassChat.ipa
        run: |
          cd client/ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r GlassChat.ipa Payload

      - name: Upload GlassChat.ipa
        uses: actions/upload-artifact@v4
        with:
          name: GlassChat-iOS-IPA
          path: client/ios/App/build/GlassChat.ipa
          retention-days: 14
